<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Assistant</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #openclaw-webview {
        width: 100%;
        height: 100%;
        border: none;
      }
      .loading {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <p>正在启动 OpenClaw Gateway...</p>
    </div>
    <webview id="openclaw-webview" src="http://localhost:18789"></webview>
    <script src="preload.js"></script>
    <script>
      // 等待WebView加载完成后隐藏加载界面
      const webview = document.getElementById('openclaw-webview');
      const loading = document.getElementById('loading');
      
      webview.addEventListener('did-finish-load', () => {
        loading.style.display = 'none';
      });
      
      // 处理WebView错误
      webview.addEventListener('did-fail-load', (event) => {
        console.error('WebView加载失败:', event.errorDescription);
        loading.innerHTML = `
          <div>
            <h2>加载失败</h2>
            <p>无法连接到 OpenClaw Gateway</p>
            <p>请检查 Gateway 是否正在运行</p>
            <button onclick="window.location.reload()">重试</button>
          </div>
        `;
      });
    </script>
  </body>
</html>
